name: Flutter CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and compile Android
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate code
        run: make generate
      - name: Generate localization
        run: make intl
      - name: Run tests
        run: flutter test --no-pub
      - name: Configure synthetic Firebase client for CI
        run: |
          mkdir -p android/app/src/release
          cp .github/fixtures/google-services.json \
            android/app/src/release/google-services.json
      - name: Compile release APK
        run: flutter build apk --release
